<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Web - Thắng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🤖 AI Prediction System</h1>
    <p>Demo Web AI chạy trên GitHub Pages</p>
</header>

<div class="container">

    <!-- INPUT -->
    <div class="card">
        <h2>🔢 Nhập dữ liệu</h2>
        <input id="input" placeholder="Nhập dữ liệu...">
        <button onclick="predict()">Dự đoán</button>
        <p id="result"></p>
    </div>

    <!-- UPLOAD CSV -->
    <div class="card">
        <h2>📁 Upload CSV</h2>
        <input type="file" id="fileInput">
        <button onclick="loadCSV()">Hiển thị dữ liệu</button>
        <table id="table"></table>
    </div>

</div>

<footer>
    <p>© 2026 - AI Web by Thang</p>
</footer>

<script src="script.js"></script>
</body>
</html>
